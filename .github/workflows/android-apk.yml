name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager não encontrado"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate native Android icons from PWA icon
        env:
          PWA_ORIGIN: 'https://express-delivery-sigma.vercel.app'
          PWA_ICON: 'ico azul android.png'
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import os, urllib.request, urllib.parse
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          url = os.environ["PWA_ORIGIN"] + "/" + urllib.parse.quote(os.environ["PWA_ICON"])
          req = urllib.request.Request(url, headers={"User-Agent": "GitHubActions-AndroidBuild"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()
          icon = Image.open(BytesIO(data)).convert("RGBA")
          if icon.width < 192 or icon.height < 192:
              raise RuntimeError("PWA icon too small for Android launcher")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          root = Path("android-wrapper/app/src/main/res")
          for density, size in sizes.items():
              folder = root / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              resized = icon.resize((size,size), Image.Resampling.LANCZOS)
              resized.save(folder / "ic_launcher.png")
              resized.save(folder / "ic_launcher_round.png")
          print("Native icons generated from:", url)
          PY
      - name: Build Android debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon assembleDebug
      - name: Name APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk 'rotix-express-delivery.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: 'rotix-express-delivery.apk'
          path: 'rotix-express-delivery.apk'
      - name: Publish APK in latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android APK" --notes "Versão Android de testes. Requer conexão com a internet. Notificações push em segundo plano não são suportadas neste wrapper."
          gh release upload android-latest 'rotix-express-delivery.apk' --clobber
